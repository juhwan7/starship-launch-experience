name: Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/starship-http.log 2>&1 &
          echo $! > /tmp/starship-http.pid
          sleep 2
      - name: Run browser smoke
        run: node scripts/browser-smoke.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-screenshots
          path: |
            smoke-home.png
            smoke-fallback.png
          if-no-files-found: ignore
